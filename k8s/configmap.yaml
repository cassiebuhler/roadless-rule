# LLM config template — NO SECRETS.
#
# The upstream LLM proxy key lives only in the nginx config (see
# `roadless-rule-nginx` below), which injects the Authorization header
# server-side via `proxy_set_header`. The browser only sees a relative
# `/api/llm` endpoint and never holds the key.
apiVersion: v1
kind: ConfigMap
metadata:
  name: roadless-rule-config
  namespace: schmidtdse
data:
  config.template.json: |
    {
        "mcp_server_url": "${MCP_SERVER_URL}",
        "llm_model": "deepseek-v4-flash",
        "transcription_model": {
            "value": "gemma-4-e4b",
            "endpoint": "/api/llm",
            "api_key": "unused"
        },
        "llm_models": [
            {
                "value": "deepseek-v4-flash",
                "label": "NRP DeepSeek V4 Flash",
                "endpoint": "/api/llm",
                "api_key": "unused"
            },
            {
                "value": "gemma",
                "label": "NRP Gemma",
                "endpoint": "/api/llm",
                "api_key": "unused"
            },
            {
                "value": "qwen",
                "label": "DSE-nimbus",
                "endpoint": "/api/llm",
                "api_key": "unused"
            },
            {
                "value": "glm-5",
                "label": "NRP GLM-5.2",
                "endpoint": "/api/llm",
                "api_key": "unused"
            },
            {
                "value": "z-ai/glm-5.2",
                "label": "GLM-5.2 (OpenRouter)",
                "endpoint": "/api/llm",
                "api_key": "unused"
            },
            {
                "value": "deepseek/deepseek-v4-flash",
                "label": "DeepSeek V4 Flash (OpenRouter)",
                "endpoint": "/api/llm",
                "api_key": "unused"
            },
            {
                "value": "qwen3",
                "label": "NRP Qwen3",
                "endpoint": "/api/llm",
                "api_key": "unused"
            },
            {
                "value": "qwen3-small",
                "label": "NRP Qwen3 Small",
                "endpoint": "/api/llm",
                "api_key": "unused"
            },
            {
                "value": "gpt-oss",
                "label": "NRP GPT-OSS 120B",
                "endpoint": "/api/llm",
                "api_key": "unused"
            },
            {
                "value": "kimi",
                "label": "NRP Kimi K2.5",
                "endpoint": "/api/llm",
                "api_key": "unused"
            },
            {
                "value": "minimax-m2",
                "label": "NRP minimax-m2",
                "endpoint": "/api/llm",
                "api_key": "unused"
            }
        ]
    }

---
# Nginx configuration — reverse-proxies /api/llm/ to open-llm-proxy and
# injects the Authorization header from ${PROXY_KEY} at container start
# (the startup command runs envsubst over this file). The browser never
# receives the key.
apiVersion: v1
kind: ConfigMap
metadata:
  name: roadless-rule-nginx
  namespace: schmidtdse
data:
  nginx.conf.template: |
    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
        add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Accept";

        # ── Reverse proxy to open-llm-proxy ──────────────────────────
        # Clients POST to /api/llm/chat/completions with a dummy bearer
        # token; nginx rewrites the Authorization header using the
        # ${PROXY_KEY} substituted in at container startup.
        #
        # In-cluster ClusterIP upstream (geo-agent-ops#73): no public DNS,
        # TLS or IPv6 egress on the path, which fixed the intermittent
        # 502/504s the public-hostname proxy_pass hit.
        location /api/llm/ {
            proxy_pass http://open-llm-proxy.schmidtdse.svc.cluster.local:8002/v1/;
            proxy_set_header Authorization "Bearer ${PROXY_KEY}";
            proxy_set_header X-Glen-App "roadless-rule";

            # Allow long agent loops (multi-turn tool use). 600s keeps the
            # timeout uniform across the whole chain: the geo-agent client
            # defaults to 600s (app/agent.js _llmTimeoutMs) and open-llm-proxy's
            # httpx timeout is 600s, so this sidecar was the odd hop at 300s —
            # cutting off slow-decode models (e.g. glm-5.2) the rest of the
            # chain would still wait for.
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;

            # Don't buffer streaming responses
            proxy_buffering off;
        }

        # Reverse proxy to the shared DuckDB MCP server. The server requires a
        # bearer token (geo-query#453); nginx attaches it from ${MCP_AUTH_TOKEN}
        # so the browser never holds it, and proxies the in-cluster Service
        # rather than the public hostname (glen-ops#73).
        # Since 2026-11-10 that is schmidtdse's own copy of the server, because NRP drops
        # pod traffic between namespaces. The token is this app's key in Secret
        # duckdb-mcp-tokens.
        location /api/mcp {
            proxy_pass http://duckdb-mcp.schmidtdse.svc.cluster.local:8000/mcp;
            # register_hex_tiles returns tile URLs on the server's in-cluster address,
            # which browsers cannot reach. Rewrite them to this app's /tiles/ (below).
            proxy_set_header Accept-Encoding "";
            sub_filter 'http://duckdb-mcp.schmidtdse.svc.cluster.local:8000/tiles/' 'https://$host/tiles/';
            sub_filter_once off;
            sub_filter_types text/event-stream application/json;
            proxy_http_version 1.1;
            proxy_set_header Host duckdb-mcp.schmidtdse.svc.cluster.local;
            proxy_set_header Connection "";
            proxy_set_header Authorization "Bearer ${MCP_AUTH_TOKEN}";
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            proxy_buffering off;
        }

        # Hex tiles from register_hex_tiles, served through the app with its token.
        location /tiles/ {
            limit_except GET { deny all; }
            proxy_pass http://duckdb-mcp.schmidtdse.svc.cluster.local:8000/tiles/;
            proxy_http_version 1.1;
            proxy_set_header Host duckdb-mcp.schmidtdse.svc.cluster.local;
            proxy_set_header Connection "";
            proxy_set_header Authorization "Bearer ${MCP_AUTH_TOKEN}";
        }

        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }

        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
